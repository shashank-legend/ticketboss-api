# Render Blueprint: one click creates the web service + a Postgres database.
# Dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: ticketboss
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_POOL_MAX
        value: "10"
      - key: DATABASE_URL
        fromDatabase:
          name: ticketboss-db
          property: connectionString

databases:
  - name: ticketboss-db
    plan: free
    databaseName: ticketboss
